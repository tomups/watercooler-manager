[project]
name = "watercooler-manager"
version = "2.0.1"
description = "Utility to manage LCT21001 / LCT22002 laptop water coolers"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
    "bleak>=3.0.2,<4",
    "pillow>=12,<13",
    "pystray>=0.19.5,<0.20",
    "winshell>=0.6,<0.7; sys_platform == 'win32'",
    "pywin32>=311; sys_platform == 'win32'",
]

[dependency-groups]
build = ["pyinstaller>=6.16,<7"]

[tool.uv]
package = false
python-downloads = "never"
python-preference = "only-system"
environments = ["sys_platform == 'linux'", "sys_platform == 'win32'"]
