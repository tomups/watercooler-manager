name: Build Windows Executable

on:
  push:
    tags:
      - 'v*' # Trigger on version tags

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller
        
    - name: Run tests
      run: python -m unittest test_temperature.py

    - name: Prepare LibreHardwareMonitor
      shell: powershell
      run: .\prepare_librehardwaremonitor.ps1

    - name: Build executable
      run: |
        pyinstaller --noconfirm --onefile --windowed --noconsole --uac-admin --hidden-import clr --icon "src/icons/connected.png" --add-data "src/icons;icons" --add-data "src/watercooler_manager;watercooler_manager" --add-binary "vendor/librehardwaremonitor/*.dll;librehardwaremonitor" --name "WaterCoolerManager" src/main.py
        
    - name: Create Release
      id: create_release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          dist/WaterCoolerManager.exe          
        name: Release ${{ github.ref_name }}
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} 