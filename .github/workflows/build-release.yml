name: Build Release

on:
  pull_request:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x86_64
            executable: WaterCoolerManager
          - os: windows-latest
            platform: windows-x86_64
            executable: WaterCoolerManager.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.17'
      - name: Install Linux runtime and create environment
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-venv python3-gi python3-gi-cairo gir1.2-gtk-3.0 gir1.2-ayatanaappindicator3-0.1 xvfb xauth dbus-x11
          uv venv --python /usr/bin/python3 --system-site-packages
          uv sync --locked --group build --python /usr/bin/python3
      - uses: actions/setup-python@v5
        if: runner.os == 'Windows'
        with:
          python-version: '3.14'
      - name: Install Windows dependencies
        if: runner.os == 'Windows'
        run: uv sync --locked --group build --python python
      - name: Build
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            .venv/Scripts/python scripts/build.py
            dist/WaterCoolerManager.exe --help
          else
            .venv/bin/python scripts/build.py
            dist/WaterCoolerManager --help
            xvfb-run -a dbus-run-session -- .venv/bin/python tests/smoke_linux_tray.py --virtual-host --executable dist/WaterCoolerManager
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: dist/${{ matrix.executable }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/linux-x86_64/WaterCoolerManager
            artifacts/windows-x86_64/WaterCoolerManager.exe
          fail_on_unmatched_files: true
